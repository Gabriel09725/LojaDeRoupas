name: Java CI - Compilação e Geração do Executável JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar o Código Java
        run: |
          mkdir -p bin
          # Busca ficheiros .java ignorando a pasta de testes (src/test) e a pasta do git
          find . -name "*.java" -not -path "*/test/*" -not -path "./.git/*" > sources.txt
          javac -d bin @sources.txt

      - name: Gerar o Arquivo Executável JAR
        run: |
          jar cvf LojaRoupas.jar -C bin .
          echo "JAR gerado com sucesso!"

      - name: Disponibilizar JAR para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Executavel-LojaRoupas-JAR
          path: LojaRoupas.jar
